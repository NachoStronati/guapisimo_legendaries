plugins {
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = "guapisimo_legendaries"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly files("libs/Cobblemon-fabric-1.8.4+1.21.1.jar")
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Copiar el mod a Prism al compilar
tasks.register('copiarAPrism', Copy) {
	dependsOn remapJar
	from remapJar
	into "C:/Users/nacho/AppData/Roaming/PrismLauncher/instances/Cobblemon Guapisimo 1.8.0/minecraft/mods"
}
build.finalizedBy copiarAPrism
